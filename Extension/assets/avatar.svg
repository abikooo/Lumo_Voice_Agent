<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DDD0"/>
      <stop offset="100%" style="stop-color:#D4C5B0"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D5B8"/>
      <stop offset="100%" style="stop-color:#E8C8A8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBg)"/>
  <!-- Body / Suit -->
  <ellipse cx="100" cy="195" rx="65" ry="50" fill="#4A5548"/>
  <!-- Shirt collar -->
  <polygon points="85,145 100,165 115,145" fill="#F5F0E8"/>
  <!-- Tie -->
  <polygon points="97,150 103,150 101,175 99,175" fill="#3A3A3A"/>
  <!-- Neck -->
  <rect x="90" y="125" width="20" height="25" rx="5" fill="url(#skinGrad)"/>
  <!-- Face -->
  <ellipse cx="100" cy="95" rx="42" ry="50" fill="url(#skinGrad)"/>
  <!-- Hair -->
  <ellipse cx="100" cy="65" rx="45" ry="35" fill="#2A1F14"/>
  <ellipse cx="60" cy="85" rx="12" ry="30" fill="#2A1F14"/>
  <ellipse cx="140" cy="85" rx="12" ry="30" fill="#2A1F14"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="98" rx="5" ry="4" fill="#2A1F14"/>
  <ellipse cx="118" cy="98" rx="5" ry="4" fill="#2A1F14"/>
  <!-- Eyebrows -->
  <path d="M73 90 Q82 86 92 90" fill="none" stroke="#2A1F14" stroke-width="2"/>
  <path d="M108 90 Q118 86 127 90" fill="none" stroke="#2A1F14" stroke-width="2"/>
  <!-- Nose -->
  <path d="M100 100 Q98 112 96 114 Q100 116 104 114 Q102 112 100 100" fill="#E0B898" opacity="0.6"/>
  <!-- Lips -->
  <path d="M90 122 Q100 128 110 122" fill="none" stroke="#C4908A" stroke-width="2" stroke-linecap="round"/>
</svg>
