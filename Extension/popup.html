<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>LumoAI</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- LOGIN SECTION -->
    <div id="login-section" style="display: none; text-align: center; padding: 20px;">
      <div class="logo">
        <span class="logo-lumo">Lumo</span><span class="logo-ai">AI</span>
      </div>
      <p style="margin-bottom: 20px; color: #666;">Please log in to continue.</p>
      <input type="email" id="emailInput" placeholder="Email"
        style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px;">
      <input type="password" id="passwordInput" placeholder="Password"
        style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px;">
      <button id="loginBtn"
        style="width: 100%; padding: 10px; background-color: #F59E0B; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Log
        In</button>
      <div id="loginError" style="color: red; margin-top: 10px; font-size: 0.8rem;"></div>
    </div>

    <!-- MAIN SECTION -->
    <div id="main-section" style="display: none;">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <span class="logo-lumo">Lumo</span><span class="logo-ai">AI</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="logoutBtn" title="Logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
          <button class="icon-btn" id="historyBtn" title="History">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" title="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Avatar Section -->
      <div class="avatar-section">
        <div class="avatar-ring">
          <div class="avatar-wrapper">
            <img src="assets/avatar.svg" alt="Lumo AI Avatar" class="avatar-img">
          </div>
          <div class="online-indicator" id="statusIndicator"></div>
        </div>
      </div>

      <!-- Status Text -->
      <div class="status-bar">
        <span class="status-text" id="statusText"></span>
      </div>

      <!-- AI Response -->
      <div class="response-area" id="responseText" style="display:none;"></div>

      <!-- Activation Toggle -->
      <div class="activation-row">
        <span class="activation-text">Activate "Hey Lumo!"</span>
        <button class="info-btn" title="Info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10" fill="#C4A265" opacity="0.8" />
            <text x="12" y="17" text-anchor="middle" fill="white" font-size="14" font-weight="bold">i</text>
          </svg>
        </button>
        <label class="toggle-switch">
          <input type="checkbox" id="heyLumoToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Activate Button -->
      <div class="activate-btn-wrapper">
        <button class="activate-btn" id="activateBtn">
          Lumo'yu Başlat
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
        <button class="deactivate-btn" id="deactivateBtn" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          </svg>
          Lumo'yu Durdur
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
